<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List - Minhas Tarefas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1><i class="fas fa-tasks"></i> Minhas Tarefas</h1>
                <p class="data-atual" id="dataAtual">Carregando...</p>
            </div>
        </header>

        <main>
            <!-- Entrada de Tarefas -->
            <section class="input-section">
                <div class="input-container">
                    <input 
                        type="text" 
                        id="novaTagefa" 
                        placeholder="Adicione uma nova tarefa..."
                        onkeypress="if(event.key==='Enter') adicionarTarefa()"
                    />
                    <select id="prioridade" class="select-prioridade">
                        <option value="baixa">Baixa Prioridade</option>
                        <option value="media" selected>Média Prioridade</option>
                        <option value="alta">Alta Prioridade</option>
                    </select>
                    <button onclick="adicionarTarefa()" class="btn-adicionar">
                        <i class="fas fa-plus"></i> Adicionar
                    </button>
                </div>
            </section>

            <!-- Filtros -->
            <section class="filtros">
                <button class="btn-filtro ativo" onclick="filtrarTarefas('todas')">📋 Todas</button>
                <button class="btn-filtro" onclick="filtrarTarefas('ativa')">⏳ Ativas</button>
                <button class="btn-filtro" onclick="filtrarTarefas('concluida')">✅ Concluídas</button>
                <button class="btn-filtro" onclick="filtrarTarefas('alta')">🔴 Alta Prioridade</button>
            </section>

            <!-- Estatísticas -->
            <section class="stats">
                <div class="stat-item">
                    <span class="stat-label">Total:</span>
                    <span class="stat-valor" id="totalTarefas">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Ativas:</span>
                    <span class="stat-valor ativa" id="ativasTarefas">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Concluídas:</span>
                    <span class="stat-valor concluida" id="concluidasTarefas">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Progresso:</span>
                    <span class="stat-valor" id="progressoTarefas">0%</span>
                </div>
            </section>

            <!-- Barra de Progresso -->
            <div class="progresso-container">
                <div class="progresso-bar" id="progressoBarra"></div>
            </div>

            <!-- Lista de Tarefas -->
            <section class="tarefas-section">
                <div id="listaTagefas" class="lista-tarefas">
                    <p class="mensagem-vazia">🎉 Nenhuma tarefa! Aproveite e relaxe!</p>
                </div>
            </section>

            <!-- Ações em Lote -->
            <section class="acoes-lote" id="acoesLote" style="display:none;">
                <button onclick="limparConcluidas()" class="btn-limpar"><i class="fas fa-trash"></i> Limpar Concluídas</button>
                <button onclick="limparTodas()" class="btn-limpar-tudo"><i class="fas fa-broom"></i> Limpar Tudo</button>
                <button onclick="exportarTarefas()" class="btn-exportar"><i class="fas fa-download"></i> Exportar</button>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
